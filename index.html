<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>內分泌系統</title>
    <style>
        /* 全螢幕與排版設定 */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #2C3E50, #000000); /* 深色科學質感背景 */
            font-family: 'Microsoft JhengHei', 'Heiti TC', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 大標題樣式 */
        h1 {
            font-size: 4rem;
            margin: 0 0 1rem 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.7);
            letter-spacing: 0.1em;
        }

        /* 副標題樣式 */
        .subtitle {
            font-size: 1.5rem;
            margin: 0 0 3rem 0;
            opacity: 0.8;
            font-weight: 300;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 影片容器 (改為純展示，移除游標手勢) */
        .video-container {
            position: relative;
            width: 60vw; /* 寬度佔螢幕 60% */
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* 影片標籤設定 */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 新增：開始按鈕樣式 */
        .enter-btn {
            margin-top: 2.5rem;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-family: 'Microsoft JhengHei', sans-serif;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #00c6ff, #0072ff); /* 科技藍漸層 */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            letter-spacing: 2px;
            outline: none;
        }

        .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 114, 255, 0.7);
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        /* 底部提示文字 */
        .hint {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* RWD 適應手機版 */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.1rem; margin-bottom: 2rem; }
            .video-container { width: 90vw; }
            .enter-btn { padding: 12px 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <h1>內分泌系統</h1>
    <p class="subtitle">激素與生理調節的奧秘</p>

    <div class="video-container">
        <video src="0.mp4" autoplay muted loop playsinline>
            您的瀏覽器不支援影片標籤。
        </video>
    </div>

    <button id="startBtn" class="enter-btn">點此開始進入課程</button>

    <p class="hint">按下 Enter 鍵也可開始</p>

    <script>
        const startBtn = document.getElementById('startBtn');
        const targetPage = '1.html';

        // 跳轉函式
        function goToNextPage() {
            window.location.href = targetPage;
        }

        // 1. 按鈕點擊事件
        startBtn.addEventListener('click', goToNextPage);

        // 2. 鍵盤全域事件 (Enter 或 Space)
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Enter' || event.code === 'Space') {
                event.preventDefault(); 
                goToNextPage();
            }
        });

        // 頁面載入後自動聚焦在按鈕上
        window.onload = () => {
            startBtn.focus();
        };
    </script>

</body>
</html>
